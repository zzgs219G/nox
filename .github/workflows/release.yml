name: release

# 两个触发入口，共用同一套打包与验证流程：
#   ① 打 tag（v*）        → 自动出 release
#   ② 手动（workflow_dispatch）→ 可指定版本号；也可只打包不发布（试运行）
#
# 为什么必须共用：两条路如果各写一份打包逻辑，迟早会漂移——
# 手动发的包和 tag 发的包内容不一致，是这类项目最容易出错的地方。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v0.2.0）。留空则用 0.0.0-dev-<短SHA>'
        required: false
        type: string
      publish:
        description: '是否创建 Release（取消勾选 = 只跑验证并上传 artifact）'
        required: false
        type: boolean
        default: true
      obfuscate:
        description: '是否用 Amice 混淆解密链（MBA）。产物 .a 里函数已混淆，消费方无需 Amice'
        required: false
        type: boolean
        default: false
      vmp_diag:
        description: '【诊断】只编 nc_guard_crypto.c 并打印 Amice 的 VMP 决策日志，不出包'
        required: false
        type: boolean
        default: false

permissions:
  contents: write    # 创建 Release 需要

jobs:
  # ── 第一关：验证。任何一步失败都不打包 ──────────────────────────
  # 为什么先验证再打包：先打包后验证的话，验证失败时 zip 已经存在，
  # 容易被误拿。本项目在构建期踩过同类坑（熵值安检必须在写盘之前）。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang binutils zip unzip python3

      - name: 生成 fixture APK（包内自测用）
        run: |
          # fixtures/sample.apk 已随仓库提交；若缺失则重新生成。
          # 它是【专用测试证书】的包，与任何真实发布包无关。
          if [ ! -f fixtures/sample.apk ]; then
            python3 fixtures/make-fixture-apk.py fixtures/sample.apk
          fi
          ls -la fixtures/sample.apk

      - name: 自测（V1–V9，判据 0 失败）
        run: |
          chmod +x test.sh
          ./test.sh

      - name: 完整例子
        run: |
          chmod +x example/run.sh
          cd example && ./run.sh

      - name: 用自己的代码跑一次 protect
        run: |
          cat > /tmp/user_code.c <<'EOF'
          __attribute__((section(".ncx"), used, retain))
          int my_algo(int x) {
              int a = x;
              for (int i = 0; i < 5; i++) a = (a * 7 + 13) & 0xFFFF;
              return a;
          }
          __attribute__((visibility("default")))
          int api_run(int x) { return my_algo(x); }
          EOF
          ./nox protect /tmp/user_code.c \
                --apk fixtures/sample.apk --package com.nox.fixture \
                -o /tmp/libuser.so
          # 必须真的有 .ncx 段，否则说明加密没生效
          readelf -SW /tmp/libuser.so | grep -q '\.ncx ' \
            || { echo "✗ 产物缺 .ncx 段"; exit 1; }
          echo "✔ 产物含 .ncx 段"

  # ── 第二关：打包 ────────────────────────────────────────────────
  build:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 确定版本号
        id: ver
        run: |
          # tag 触发 → 用 tag 名
          # 手动触发 → 用输入的版本号，留空则用 0.0.0-dev-<SHA>
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="0.0.0-dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本号: $V"

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip python3

      - name: 安装 Android NDK（打包静态库形态需要交叉编译）
        run: |
          # make-zip-lib.sh 要把 so-guard/*.c 交叉编译成双 ABI 静态库。
          # 版本固定 r27d（与消费方 artifact-pipeline 的 setup-ndk 一致），
          # 换版 = 换 .a 的 ABI/目标三元组，必须同步验证。
          #
          # ⚠️ 不用 sdkmanager：它只认完整版本号（如 "ndk;27.0.12077973"），
          #    写 "ndk;r27d" 会报 "Failed to find package"（v0.4.0 实测踩过）。
          #    直接下官方压缩包更稳，且体积/时间可控。
          NDK_VER=r27d
          NDK_ZIP="android-ndk-${NDK_VER}-linux.zip"
          curl -fsSL -o /tmp/ndk.zip \
            "https://dl.google.com/android/repository/${NDK_ZIP}"
          mkdir -p "$RUNNER_TEMP/ndk"
          unzip -q /tmp/ndk.zip -d "$RUNNER_TEMP/ndk"
          NDK_DIR="$RUNNER_TEMP/ndk/android-ndk-${NDK_VER}"
          test -d "$NDK_DIR" || { echo "✗ NDK 解压目录不存在: $NDK_DIR"; ls "$RUNNER_TEMP/ndk"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK: $NDK_DIR"
          ls "$NDK_DIR/toolchains/llvm/prebuilt/"
          ls "$NDK_DIR"/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android21-clang

      # ── Amice bundle（仅勾选 obfuscate 时）─────────────────────────
      # 为什么混淆必须在【这里】做，而不是消费方编译时：
      #   本仓库发的是 libnox.a（已编译机器码），消费方直接链接。
      #   Amice 是编译期 pass，只能在编译源码时生效 —— 消费方拿到 .a
      #   后无法再混淆其中函数。
      #   2026-11-05 实测过这个空转：消费方开 AMICE_MBA=true 后，
      #   ncg_boot_key 里 HKDF 调用处的反汇编与无混淆版逐条指令一致。
      #
      # ⚠️ 混淆时 make-zip-lib.sh 会用 bundle 自带的 NDK（不是上面的 r27d）：
      #   插件按 LLVM 主版本编译，与 NDK clang 严格绑定。错配不是报错，
      #   是段错误（实测 clang 18 加载 r29 插件 → exit 139）。
      # ⚠️ if 用 == 'true' 而不是裸 inputs.obfuscate：
      #   tag 推送触发时 inputs 为空，裸写法在某些上下文会报错。
      # ── 混淆开关的单一判定（2026-11-06）────────────────────────────
      # 两条路都能开混淆，且互不干扰：
      #   ① 打 tag 且 tag 名以 -obf 结尾     → git tag v1.0.0-obf && git push --tags
      #   ② 手动 dispatch 且勾选 obfuscate
      #
      # 为什么需要 tag 这条路：push tag 触发时 workflow_dispatch 的 inputs
      # 全为空，`inputs.obfuscate == true` 恒假 → 打标签永远出普通版。
      # 而"打标签就出正式包"是正常预期，不该要求人记得去点手动流程。
      #
      # 版本号里带 -obf 本身就是最清楚的记录：看 tag 名就知道这版有没有混淆。
      - name: 判定是否启用混淆
        id: obf
        run: |
          set -euo pipefail
          ON=false
          if [[ "${{ github.event_name }}" == "push" ]]; then
            REF="${{ github.ref_name }}"
            # 唯一后缀：-obf。不含它的 tag 一律出普通版。
            if [[ "$REF" == *-obf* ]]; then ON=true; fi
            echo "tag 触发: $REF → 混淆=$ON"
          else
            if [[ "${{ inputs.obfuscate }}" == "true" ]]; then ON=true; fi
            echo "手动触发: obfuscate=${{ inputs.obfuscate }} → 混淆=$ON"
          fi
          echo "on=$ON" >> "$GITHUB_OUTPUT"

      - name: 取 Amice bundle
        if: steps.obf.outputs.on == 'true'
        uses: actions/cache@v4
        with:
          path: ~/amice-bundle
          key: amice-r29-v0.1.6-nox3

      - name: 下载 Amice bundle（cache 未命中时）
        if: steps.obf.outputs.on == 'true'
        run: |
          set -euo pipefail
          if [[ -f ~/amice-bundle/amice/lib/libamice.so ]]; then
            echo "OK: cache 命中"; exit 0
          fi
          mkdir -p ~/amice-bundle && cd ~/amice-bundle
          URL=https://github.com/zzgs219G/amice/releases/download/v0.1.6-nox3/amice-android-ndk-r29-linux-x86_64.tar.gz
          curl -fL --retry 3 -o a.tar.gz "$URL"
          curl -fsSL -o a.sha256 "$URL.sha256"
          WANT=$(awk '{print $1}' a.sha256); GOT=$(sha256sum a.tar.gz | awk '{print $1}')
          [[ "$WANT" == "$GOT" ]] || { echo "sha256 不符"; exit 1; }
          tar xzf a.tar.gz && rm -f a.tar.gz
          SRC=$(find . -maxdepth 1 -type d -name 'amice-android-ndk-*' | head -1)
          mv "$SRC"/* . && rmdir "$SRC"
          echo "OK: 解压完成"

      - name: 打包（静态库形态）
        env:
          OBFUSCATE: ${{ steps.obf.outputs.on }}
        run: |
          # 发的是 .a 形态：只给头文件 + Python 工具 + 双 ABI libnox.a，
          # 不给 C 源码。脚本内部会先交叉编译再打包，一条命令走完。
          #
          # 勾了 obfuscate → 设 AMICE_BUNDLE，脚本会用 bundle 的 NDK +
          #   -fpass-plugin 编译，产出的 .a 里解密链 3 函数已混淆。
          # 不勾 → AMICE_BUNDLE 为空，普通编译（行为与改动前一致）。
          if [[ "${OBFUSCATE:-false}" == "true" ]]; then
            export AMICE_BUNDLE="$HOME/amice-bundle"
            echo "混淆已启用: $AMICE_BUNDLE"
          else
            echo "普通编译（无混淆）"
          fi
          chmod +x scripts/make-zip-lib.sh
          ./scripts/make-zip-lib.sh "${{ steps.ver.outputs.version }}"

      - name: 校验包内容
        run: |
          Z="dist/nox-${{ steps.ver.outputs.version }}.zip"
          test -f "$Z" || { echo "✗ 包不存在"; exit 1; }
          echo "包大小: $(stat -c%s "$Z") 字节"

          # 静态库形态：必需文件（.h + .py + 双 ABI .a，无 .c）
          for f in nox test.sh README.md AGENTS.md QUICKSTART.md \
                   so-guard/nc_guard_layout.h so-guard/nc_guard_key.h \
                   so-guard/nc_guard_paths.h so-guard/so-section-lock.py \
                   so-guard/so_section_mark.py \
                   so-guard/lib/arm64-v8a/libnox.a \
                   so-guard/lib/armeabi-v7a/libnox.a \
                   fixtures/sample.c fixtures/sample.apk example/run.sh; do
            unzip -l "$Z" | grep -q "nox/$f" \
              || { echo "✗ 包内缺: $f"; exit 1; }
          done
          echo "✔ 必需文件齐全（头文件 + Python + 双 ABI 静态库）"

          # 反向断言：不得含 C 源码（静态库形态的核心契约）
          BAD=$(unzip -l "$Z" | grep -E 'so-guard/[^/]*\.c$' || true)
          if [ -n "$BAD" ]; then
            echo "✗ 包内含 C 源码（静态库形态不该有）:"
            echo "$BAD"
            exit 1
          fi
          echo "✔ 未含 C 源码（静态库形态正确）"

          # 断言：.a 必须是真 ARM 机器码，不是空文件/错架构
          T=$(mktemp -d); unzip -q "$Z" -d "$T"
          for abi in arm64-v8a armeabi-v7a; do
            A="$T/nox/so-guard/lib/$abi/libnox.a"
            [ -s "$A" ] || { echo "✗ $abi/libnox.a 为空"; exit 1; }
            echo "  $abi/libnox.a: $(stat -c%s "$A") 字节"
          done
          BIN=$(ls "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)
          "$BIN" -h "$T/nox/so-guard/lib/arm64-v8a/libnox.a" | grep -q AArch64 \
            || { echo "✗ arm64-v8a 的 .a 不是 AArch64"; exit 1; }
          "$BIN" -h "$T/nox/so-guard/lib/armeabi-v7a/libnox.a" | grep -q "ARM" \
            || { echo "✗ armeabi-v7a 的 .a 不是 ARM"; exit 1; }
          echo "✔ 双 ABI 静态库架构正确"

      - name: 冒烟测试（解压后零参数自测 + 真实加密链路）
        run: |
          T=$(mktemp -d)
          cd "$T"
          unzip -q "$GITHUB_WORKSPACE/dist/nox-${{ steps.ver.outputs.version }}.zip"
          cd nox
          ./test.sh

          # 再用临时用户代码验一次完整链路。
          # 静态库形态下 nox 会自动选 ABI（包内多 ABI 时默认 arm64-v8a）。
          cat > user.c <<'EOF'
          __attribute__((section(".ncx"), used, retain))
          int my_secret(int a) { return (a ^ 0x5A) * 3; }
          __attribute__((visibility("default")))
          int demo_call(int a) { return my_secret(a); }
          EOF
          ./nox protect user.c --apk fixtures/sample.apk --package com.nox.ci \
                  -o libuser.so
          readelf -SW libuser.so | grep -q '\.ncx ' \
            || { echo "✗ 产物缺 .ncx 段"; exit 1; }
          N=$(nm libuser.so 2>/dev/null | wc -l)
          [ "$N" -eq 0 ] || { echo "✗ 符号表未清空（$N 个）"; exit 1; }
          # 静态库形态必须产出目标架构的机器码（.a 是 ARM，产物也应如此）
          readelf -h libuser.so | grep -q AArch64 \
            || { echo "✗ 产物不是 AArch64（.a 架构与目标不符？）"; exit 1; }
          echo "✔ 用户代码加密成功、含 .ncx 段、符号已清空、架构 AArch64"

          # 元数据清理必须生效（2026-11-06 补）。
          # 为什么在 CI 也验一遍：test.sh 的 V9 已经验了，但这里验的是
          # 【.a 形态 + 真实 --abi 交叉编译】这条生产路径 —— 它与 V9 走的
          # 源码形态不是同一条链路。AGENTS.md §5.4 要求"必须清理"，
          # 两条路径都得钉住，否则漏一条就是静默失效。
          for sec in .eh_frame .eh_frame_hdr .comment; do
            if readelf -SW libuser.so | grep -q -- "$sec"; then
              echo "✗ 产物残留 $sec（--strip-meta 没生效？）"; exit 1
            fi
          done
          strings -n 5 libuser.so | grep -qiE 'Android \(|clang version' \
            && { echo "✗ 产物残留 clang 工具链指纹"; exit 1; }
          echo "✔ 元数据已清理（.eh_frame/.comment/指纹 零命中）"

      - name: 生成校验和
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nox-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

  # ── 诊断 job：只编 nc_guard_crypto.c，打印 Amice 的 VMP 决策 ──────
  # 用途（2026-11-06 加）：确认某个函数迁入 nc_guard_crypto.c 后，
  # VMP 到底是【跳过】还是【生成了错误代码】。两种情况的排查方向
  # 完全不同，而不看 Amice 自己的 debug 日志无法区分。
  #
  # 背景：ncg_ctr_xor 迁入后 CI 的 V7 崩（执行结果空），本地 clang 21
  # 不复现。盲试了两轮都没定位，所以加这个诊断入口，一次看清。
  #
  # 只在手动触发且勾 vmp_diag 时跑，不影响正常发版。
  vmp-diag:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.vmp_diag
    steps:
      - uses: actions/checkout@v4

      - name: 装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang binutils python3 curl unzip

      - name: 取 Amice bundle
        uses: actions/cache@v4
        with:
          path: ~/amice-bundle
          key: amice-r29-v0.1.6-nox3

      - name: 下载 Amice bundle
        run: |
          set -euo pipefail
          if [[ -f ~/amice-bundle/amice/lib/libamice.so ]]; then
            echo "OK: cache 命中"; exit 0
          fi
          mkdir -p ~/amice-bundle && cd ~/amice-bundle
          URL=https://github.com/zzgs219G/amice/releases/download/v0.1.6-nox3/amice-android-ndk-r29-linux-x86_64.tar.gz
          curl -fL --retry 3 -o a.tar.gz "$URL"
          curl -fsSL -o a.sha256 "$URL.sha256"
          WANT=$(awk '{print $1}' a.sha256); GOT=$(sha256sum a.tar.gz | awk '{print $1}')
          [[ "$WANT" == "$GOT" ]] || { echo "sha256 不符"; exit 1; }
          tar xzf a.tar.gz && rm -f a.tar.gz
          SRC=$(find . -maxdepth 1 -type d -name 'amice-android-ndk-*' | head -1)
          mv "$SRC"/* . && rmdir "$SRC"

      - name: 编译 nc_guard_crypto.c 并抓 VMP 决策日志
        run: |
          set -euo pipefail
          NDK=$(find ~/amice-bundle -maxdepth 1 -type d -name 'android-ndk-*' | head -1)
          CC=$(ls "$NDK"/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android21-clang | head -1)
          export LD_LIBRARY_PATH="$HOME/amice-bundle/amice/llvm-lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          PLUGIN="$HOME/amice-bundle/amice/lib/libamice.so"
          PROFILE="$PWD/scripts/so-guard/vmp-profile-func"

          # ⚠️ 编译参数必须与 make-zip-lib.sh 的 $CFLAGS 完全一致，
          #    尤其 -ffunction-sections -fdata-sections —— 少了它们
          #    VMP 无法为每个函数生成独立段，VM 子段数会是 0
          #    （实测踩过：诊断里漏了这两个参数，误判成"VMP 没生效"）。
          echo "════════ 关键一：VMP 对每个函数的决策 ════════"
          RUST_LOG=amice=debug AMICE_VM_VIRTUALIZE=true \
            AMICE_VM_PROFILE_PATH="$PROFILE" \
            "$CC" -c -fPIC -fvisibility=hidden -fno-ident -Oz \
            -ffunction-sections -fdata-sections -DNC_GUARD_SECTIONED \
            -I scripts/so-guard -fpass-plugin="$PLUGIN" \
            scripts/so-guard/nc_guard_crypto.c -o /tmp/crypto.o 2>&1 \
            | grep -iE 'VmVirtualize|skip|virtualiz' | head -60 || true

          echo ""
          echo "════════ 关键二：VM 子段数（>0 = 至少生成了一套）════════"
          readelf -SW /tmp/crypto.o | grep -c 'L\.L__' || true

          echo ""
          echo "════════ 关键三：每个符号所在段（.text.<fn> = 已虚拟化）════════"
          # ⚠️ 不用 llvm-objdump --disassemble-symbols：实测在 CI 的 Ubuntu
          #    工具链上对含大量自定义段的 .o 会返回空（v0.9.9 产物明明有
          #    200 个 VM 子段，这里却全 0）。改用 readelf 列符号表，
          #    规律：VMP 虚拟化后函数体被搬走，符号只剩一个薄包装，
          #    且会出现 .text.<fn> 这样的独立段。
          readelf -sW /tmp/crypto.o | awk '$4=="FUNC" && $8!="" {print $8}' \
            | grep -v '\.' | sort -u > /tmp/fns.txt || true
          echo "  crypto.o 里的函数符号:"
          sed 's/^/    /' /tmp/fns.txt
          echo ""
          echo "  VM 子段（.text..L.L__* / .rodata..L.L__*）:"
          readelf -SW /tmp/crypto.o | grep -o '\.\(text\|rodata\)\.\.L\.L__[0-9a-f]*' \
            | sort -u | head -20
          echo ""
          echo "  合计 VM 子段: $(readelf -SW /tmp/crypto.o | grep -c 'L\.L__')"

  # ── 第三关：发布 ────────────────────────────────────────────────
  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    # tag 推送必定发布；手动触发按 publish 勾选决定
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nox-${{ needs.build.outputs.version }}
          path: dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          # 版本号可能不带 v 前缀（手动输入 "0.2.0"），tag 补上 v
          case "$V" in
            v*) TAG="$V" ;;
            *)  TAG="v$V" ;;
          esac

          # 若 tag 已存在（手动重跑同一版本），先删再建，避免 Release 创建失败
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true

          NOTES=$(cat <<EOF
          nox $V — so 段加密设施

          ## 快速开始

          \`\`\`bash
          unzip nox-*.zip && cd nox
          ./test.sh                 # 自测 V1–V9，判据 0 失败
          cd example && ./run.sh    # 完整演示：加密前后对比
          \`\`\`

          用你自己的代码：

          \`\`\`bash
          ./nox protect 你的代码.c --apk 你的签名APK -o libyour.so
          \`\`\`

          ## 必须知道的四条

          1. **必须提供已签名的 APK** —— 密钥由 APK 证书派生，运行期从已安装的 APK
             重读证书。没有 APK 就解不开，只能保护 Android App 里的 so。
          2. **只能保护加过标记的函数** ——
             \`__attribute__((section(".ncx"), used, retain))\`，必须重新编译。
             不能加密已编好的成品 so。
          3. **用错 APK 会解不开** —— \`--apk\` 必须是最终签名用的那个证书。
             换 keystore 重签后旧产物失效，这是设计不是 bug。
          4. **挡的是静态分析，不是动态调试** —— 代码要执行就必然有明文的一刻，
             有 Frida 的人可以蹲到那个瞬间。这套的作用是让 \`strings\`、
             反汇编、静态审计失效。

          ## 强度边界（如实）

          目标是**抬高成本**，不是不可破解。详见包内 README.md。

          ## 校验和

          \`\`\`
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          EOF
          )

          gh release create "$TAG" \
             --title "nox $V" \
             --notes "$NOTES" \
             dist/*.zip dist/SHA256SUMS.txt
