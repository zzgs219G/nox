name: release

# 两个触发入口，共用同一套打包与验证流程：
#   ① 打 tag（v*）        → 自动出 release
#   ② 手动（workflow_dispatch）→ 可指定版本号；也可只打包不发布（试运行）
#
# 为什么必须共用：两条路如果各写一份打包逻辑，迟早会漂移——
# 手动发的包和 tag 发的包内容不一致，是这类项目最容易出错的地方。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v0.2.0）。留空则用 0.0.0-dev-<短SHA>'
        required: false
        type: string
      publish:
        description: '是否创建 Release（取消勾选 = 只跑验证并上传 artifact）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write    # 创建 Release 需要

jobs:
  # ── 第一关：验证。任何一步失败都不打包 ──────────────────────────
  # 为什么先验证再打包：先打包后验证的话，验证失败时 zip 已经存在，
  # 容易被误拿。本项目在构建期踩过同类坑（熵值安检必须在写盘之前）。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang binutils zip unzip python3

      - name: 生成 fixture APK（包内自测用）
        run: |
          # fixtures/sample.apk 已随仓库提交；若缺失则重新生成。
          # 它是【专用测试证书】的包，与任何真实发布包无关。
          if [ ! -f fixtures/sample.apk ]; then
            python3 fixtures/make-fixture-apk.py fixtures/sample.apk
          fi
          ls -la fixtures/sample.apk

      - name: 自测（14 项）
        run: |
          chmod +x test.sh
          ./test.sh

      - name: 完整例子
        run: |
          chmod +x example/run.sh
          cd example && ./run.sh

      - name: 用自己的代码跑一次 protect
        run: |
          cat > /tmp/user_code.c <<'EOF'
          __attribute__((section(".ncx"), used, retain))
          int my_algo(int x) {
              int a = x;
              for (int i = 0; i < 5; i++) a = (a * 7 + 13) & 0xFFFF;
              return a;
          }
          __attribute__((visibility("default")))
          int api_run(int x) { return my_algo(x); }
          EOF
          ./nox protect /tmp/user_code.c \
                --apk fixtures/sample.apk --package com.nox.fixture \
                -o /tmp/libuser.so
          # 必须真的有 .ncx 段，否则说明加密没生效
          readelf -SW /tmp/libuser.so | grep -q '\.ncx ' \
            || { echo "✗ 产物缺 .ncx 段"; exit 1; }
          echo "✔ 产物含 .ncx 段"

  # ── 第二关：打包 ────────────────────────────────────────────────
  build:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 确定版本号
        id: ver
        run: |
          # tag 触发 → 用 tag 名
          # 手动触发 → 用输入的版本号，留空则用 0.0.0-dev-<SHA>
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="0.0.0-dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本号: $V"

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip python3

      - name: 安装 Android NDK（打包静态库形态需要交叉编译）
        run: |
          # make-zip-lib.sh 要把 so-guard/*.c 交叉编译成双 ABI 静态库。
          # 版本固定 r27d（与消费方 artifact-pipeline 的 setup-ndk 一致），
          # 换版 = 换 .a 的 ABI/目标三元组，必须同步验证。
          NDK_VER=r27d
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;$NDK_VER" >/dev/null
          echo "NDK: $ANDROID_HOME/ndk/$NDK_VER"
          ls "$ANDROID_HOME/ndk/$NDK_VER/ndk-build"

      - name: 打包（静态库形态）
        run: |
          # 发的是 .a 形态：只给头文件 + Python 工具 + 双 ABI libnox.a，
          # 不给 C 源码。脚本内部会先交叉编译再打包，一条命令走完。
          chmod +x scripts/make-zip-lib.sh
          ./scripts/make-zip-lib.sh "${{ steps.ver.outputs.version }}"

      - name: 校验包内容
        run: |
          Z="dist/nox-${{ steps.ver.outputs.version }}.zip"
          test -f "$Z" || { echo "✗ 包不存在"; exit 1; }
          echo "包大小: $(stat -c%s "$Z") 字节"

          # 静态库形态：必需文件（.h + .py + 双 ABI .a，无 .c）
          for f in nox test.sh README.md AGENTS.md QUICKSTART.md \
                   so-guard/nc_guard_layout.h so-guard/nc_guard_key.h \
                   so-guard/nc_guard_paths.h so-guard/so-section-lock.py \
                   so-guard/so_section_mark.py \
                   so-guard/lib/arm64-v8a/libnox.a \
                   so-guard/lib/armeabi-v7a/libnox.a \
                   fixtures/sample.c fixtures/sample.apk example/run.sh; do
            unzip -l "$Z" | grep -q "nox/$f" \
              || { echo "✗ 包内缺: $f"; exit 1; }
          done
          echo "✔ 必需文件齐全（头文件 + Python + 双 ABI 静态库）"

          # 反向断言：不得含 C 源码（静态库形态的核心契约）
          BAD=$(unzip -l "$Z" | grep -E 'so-guard/[^/]*\.c$' || true)
          if [ -n "$BAD" ]; then
            echo "✗ 包内含 C 源码（静态库形态不该有）:"
            echo "$BAD"
            exit 1
          fi
          echo "✔ 未含 C 源码（静态库形态正确）"

          # 断言：.a 必须是真 ARM 机器码，不是空文件/错架构
          T=$(mktemp -d); unzip -q "$Z" -d "$T"
          for abi in arm64-v8a armeabi-v7a; do
            A="$T/nox/so-guard/lib/$abi/libnox.a"
            [ -s "$A" ] || { echo "✗ $abi/libnox.a 为空"; exit 1; }
            echo "  $abi/libnox.a: $(stat -c%s "$A") 字节"
          done
          BIN=$(ls "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)
          "$BIN" -h "$T/nox/so-guard/lib/arm64-v8a/libnox.a" | grep -q AArch64 \
            || { echo "✗ arm64-v8a 的 .a 不是 AArch64"; exit 1; }
          "$BIN" -h "$T/nox/so-guard/lib/armeabi-v7a/libnox.a" | grep -q "ARM" \
            || { echo "✗ armeabi-v7a 的 .a 不是 ARM"; exit 1; }
          echo "✔ 双 ABI 静态库架构正确"

      - name: 冒烟测试（解压后零参数自测 + 真实加密链路）
        run: |
          T=$(mktemp -d)
          cd "$T"
          unzip -q "$GITHUB_WORKSPACE/dist/nox-${{ steps.ver.outputs.version }}.zip"
          cd nox
          ./test.sh

          # 再用临时用户代码验一次完整链路。
          # 静态库形态下 nox 会自动选 ABI（包内多 ABI 时默认 arm64-v8a）。
          cat > user.c <<'EOF'
          __attribute__((section(".ncx"), used, retain))
          int my_secret(int a) { return (a ^ 0x5A) * 3; }
          __attribute__((visibility("default")))
          int demo_call(int a) { return my_secret(a); }
          EOF
          ./nox protect user.c --apk fixtures/sample.apk --package com.nox.ci \
                  -o libuser.so
          readelf -SW libuser.so | grep -q '\.ncx ' \
            || { echo "✗ 产物缺 .ncx 段"; exit 1; }
          N=$(nm libuser.so 2>/dev/null | wc -l)
          [ "$N" -eq 0 ] || { echo "✗ 符号表未清空（$N 个）"; exit 1; }
          # 静态库形态必须产出目标架构的机器码（.a 是 ARM，产物也应如此）
          readelf -h libuser.so | grep -q AArch64 \
            || { echo "✗ 产物不是 AArch64（.a 架构与目标不符？）"; exit 1; }
          echo "✔ 用户代码加密成功、含 .ncx 段、符号已清空、架构 AArch64"

      - name: 生成校验和
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nox-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

  # ── 第三关：发布 ────────────────────────────────────────────────
  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    # tag 推送必定发布；手动触发按 publish 勾选决定
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nox-${{ needs.build.outputs.version }}
          path: dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          # 版本号可能不带 v 前缀（手动输入 "0.2.0"），tag 补上 v
          case "$V" in
            v*) TAG="$V" ;;
            *)  TAG="v$V" ;;
          esac

          # 若 tag 已存在（手动重跑同一版本），先删再建，避免 Release 创建失败
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true

          NOTES=$(cat <<EOF
          nox $V — so 段加密设施

          ## 快速开始

          \`\`\`bash
          unzip nox-*.zip && cd nox
          ./test.sh                 # 14 项自测，验证工具链
          cd example && ./run.sh    # 完整演示：加密前后对比
          \`\`\`

          用你自己的代码：

          \`\`\`bash
          ./nox protect 你的代码.c --apk 你的签名APK -o libyour.so
          \`\`\`

          ## 必须知道的四条

          1. **必须提供已签名的 APK** —— 密钥由 APK 证书派生，运行期从已安装的 APK
             重读证书。没有 APK 就解不开，只能保护 Android App 里的 so。
          2. **只能保护加过标记的函数** ——
             \`__attribute__((section(".ncx"), used, retain))\`，必须重新编译。
             不能加密已编好的成品 so。
          3. **用错 APK 会解不开** —— \`--apk\` 必须是最终签名用的那个证书。
             换 keystore 重签后旧产物失效，这是设计不是 bug。
          4. **挡的是静态分析，不是动态调试** —— 代码要执行就必然有明文的一刻，
             有 Frida 的人可以蹲到那个瞬间。这套的作用是让 \`strings\`、
             反汇编、静态审计失效。

          ## 强度边界（如实）

          目标是**抬高成本**，不是不可破解。详见包内 README.md。

          ## 校验和

          \`\`\`
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          EOF
          )

          gh release create "$TAG" \
             --title "nox $V" \
             --notes "$NOTES" \
             dist/*.zip dist/SHA256SUMS.txt
